<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Header bar -->
  <rect width="1200" height="180" fill="url(#header)"/>

  <!-- Title -->
  <text x="80" y="100" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="white">Practical Tools</text>
  <text x="80" y="148" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="rgba(255,255,255,0.88)">12 free online calculators · no signup · 实用计算器</text>

  <!-- Tool cards -->
  <g transform="translate(80, 220)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="160" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <text x="90" y="55" font-family="Arial, Helvetica, sans-serif" font-size="44" text-anchor="middle">🏷️</text>
    <text x="90" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#6b7280">Discount</text>

    <!-- Card 2 -->
    <rect x="205" y="0" width="180" height="160" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <text x="295" y="55" font-family="Arial, Helvetica, sans-serif" font-size="44" text-anchor="middle">⚖️</text>
    <text x="295" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#6b7280">BMI</text>

    <!-- Card 3 -->
    <rect x="410" y="0" width="180" height="160" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <text x="500" y="55" font-family="Arial, Helvetica, sans-serif" font-size="44" text-anchor="middle">⏳</text>
    <text x="500" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#6b7280">Countdown</text>

    <!-- Card 4 -->
    <rect x="615" y="0" width="180" height="160" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <text x="705" y="55" font-family="Arial, Helvetica, sans-serif" font-size="44" text-anchor="middle">📅</text>
    <text x="705" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#6b7280">Lunar calendar</text>

    <!-- Card 5 -->
    <rect x="820" y="0" width="180" height="160" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <text x="910" y="55" font-family="Arial, Helvetica, sans-serif" font-size="44" text-anchor="middle">📐</text>
    <text x="910" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#6b7280">Unit converter</text>
  </g>

  <!-- Footer -->
  <text x="80" y="480" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#6b7280">getpracticaltools.com</text>
  <text x="80" y="520" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#9ca3af">Free browser-based tools. Nothing to install, nothing to sign up for.</text>
</svg>
